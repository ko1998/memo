name: 打包 macOS 安装包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 打包（通用版：Intel + 苹果芯片）
        run: npm run dist:mac -- --universal

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: memo-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
