[package]
name = "memo"
version = "1.0.0"
description = "桌面置顶备忘录：可编辑、点完成、对角移动、本地存储、离线可用"
edition = "2021"

[lib]
name = "memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
